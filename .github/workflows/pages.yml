name: Build & deploy
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write # required for deployment
  id-token: write # required for deployment

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1  Set up Node so Browserify works
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2  Install dependencies
      - run: npm ci

      # 3  Lint and test before anything ships
      - run: npx standard
      - run: npm test

      # 4  Build the slim corpus index and the browser bundle
      - run: npm run build

      # 5  Stage only the files the site actually serves.
      #    upload-pages-artifact@v3 has no exclude input, so uploading "." would
      #    ship the whole node_modules tree.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          mkdir -p _site/scripts && cp scripts/bundle.js _site/scripts/
          mkdir -p _site/hinos
          cp hinos/corpus.json _site/hinos/
          cp hinos/td.json _site/hinos/

      # 6  Upload the static site as a Pages artefact
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
