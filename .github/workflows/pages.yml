name: Build & deploy
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write # required for deployment
  id-token: write # required for deployment

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1  Set up Node so Browserify works
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2  Install dependencies
      - run: npm ci

      # 3  Bundle your code (use the npm script or match its exact command)
      - run: npm run build

      # 4  Upload the static site as a Pages artefact
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          exclude: node_modules

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
